<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mokage Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>チャットルーム</h2>

<div>
  <input id="roomName" placeholder="新しい箱の名前">
  <button id="createRoom">箱を作る</button>
</div>

<ul id="roomList"></ul>

<hr>

<h3 id="currentRoom">未選択</h3>

<div id="messages"></div>

<input id="messageInput" placeholder="メッセージ">
<button id="sendBtn">送信</button>

<script type="module" src="chat.js"></script>
</body>
</html>
