<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Research AI Lab</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #202124;
      --sub: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --good: #16a34a;
      --maybe: #d97706;
      --bad: #dc2626;
      --shadow:
        0 8px 30px rgba(0, 0, 0, 0.07);
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: white;
      font-weight: 700;
    }

    .brand h1 {
      font-size: 20px;
      margin: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--sub);
      font-size: 12px;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
    }

    .connection-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9ca3af;
    }

    .connection-dot.ok {
      background: var(--good);
    }

    .connection-dot.error {
      background: var(--bad);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .research-card {
      padding: 20px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .section-title span {
      color: var(--sub);
      font-size: 12px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 15px;
      outline: none;
      background: #fafafa;
    }

    textarea:focus {
      border-color: var(--accent);
      background: white;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .primary,
    .secondary {
      border: none;
      border-radius: 11px;
      padding: 11px 16px;
      font-weight: 600;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .primary:hover {
      background: var(--accent-hover);
    }

    .secondary {
      background: #eef0f3;
      color: #374151;
    }

    .primary:disabled,
    .secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--line);
      font-size: 13px;
      white-space: pre-wrap;
      display: none;
    }

    .status-box.show {
      display: block;
    }

    .status-box.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .status-box.success {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #166534;
    }

    .latest {
      margin-top: 20px;
    }

    .latest-content {
      padding: 18px;
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .result-title {
      margin: 0;
      font-size: 18px;
    }

    .result-date {
      color: var(--sub);
      font-size: 11px;
      margin-top: 5px;
    }

    .symbol {
      min-width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      border: 1px solid var(--line);
    }

    .symbol.good {
      color: var(--good);
      background: #f0fdf4;
    }

    .symbol.maybe {
      color: var(--maybe);
      background: #fffbeb;
    }

    .symbol.bad {
      color: var(--bad);
      background: #fef2f2;
    }

    .symbol.unknown {
      color: #6b7280;
      background: #f3f4f6;
    }

    .result-summary {
      margin-top: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .result-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .tag {
      background: #f3f4f6;
      border-radius: 999px;
      padding: 5px 9px;
      color: #4b5563;
      font-size: 11px;
    }

    .details {
      margin-top: 15px;
      border-top: 1px solid var(--line);
      padding-top: 15px;
    }

    .detail-block {
      margin-bottom: 18px;
    }

    .detail-block h3 {
      margin: 0 0 7px;
      font-size: 13px;
    }

    .detail-block p {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 13px;
      color: #374151;
    }

    .right-card {
      padding: 18px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-height: 650px;
      overflow-y: auto;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px;
      background: white;
      transition: 0.15s;
    }

    .history-item:hover {
      border-color: #cbd5e1;
      background: #fafafa;
    }

    .history-main {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .history-symbol {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .history-symbol.good {
      color: var(--good);
      background: #f0fdf4;
    }

    .history-symbol.maybe {
      color: var(--maybe);
      background: #fffbeb;
    }

    .history-symbol.bad {
      color: var(--bad);
      background: #fef2f2;
    }

    .history-symbol.unknown {
      color: #6b7280;
      background: #f3f4f6;
    }

    .history-title {
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-date {
      color: var(--sub);
      font-size: 10px;
      margin-top: 3px;
    }

    .history-empty {
      text-align: center;
      color: var(--sub);
      padding: 30px 10px;
      font-size: 13px;
    }

    .small-note {
      color: var(--sub);
      font-size: 11px;
      line-height: 1.6;
      margin-top: 10px;
    }

    .progress {
      margin-top: 14px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--sub);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }

    .progress-value {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s;
    }

    .evaluation-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .evaluation-item {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fafafa;
    }

    .evaluation-item .label {
      font-size: 10px;
      color: var(--sub);
    }

    .evaluation-item .value {
      margin-top: 3px;
      font-weight: 700;
      font-size: 17px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header>

    <div class="brand">

      <div class="brand-icon">
        ∑
      </div>

      <div>
        <h1>
          Research AI Lab
        </h1>

        <p>
          数学研究・仮説探索・検証システム
        </p>
      </div>

    </div>


    <div class="connection">

      <span
        id="connectionDot"
        class="connection-dot"
      ></span>

      <span id="connectionText">
        Supabase 接続確認中...
      </span>

    </div>

  </header>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <div class="layout">


    <!-- ===================================================
         LEFT
    ==================================================== -->

    <main>


      <section class="card research-card">

        <div class="section-title">

          <h2>
            新しい研究
          </h2>

          <span>
            AI研究ルートを自動記録
          </span>

        </div>


        <textarea
          id="questionInput"
          placeholder="数学的な問題・仮説・疑問を入力してください。

例：
素数の分布について、既存の定理を単に使うのではなく、別の不変量から新しい見方ができないか検討したい。"
        ></textarea>


        <div class="actions">

          <button
            id="researchButton"
            class="primary"
          >
            研究開始
          </button>

          <button
            id="clearButton"
            class="secondary"
          >
            入力を消去
          </button>

        </div>


        <div
          id="statusBox"
          class="status-box"
        ></div>


        <div
          id="progress"
          class="progress hidden"
        >

          <div class="progress-label">

            <span id="progressText">
              準備中...
            </span>

            <span id="progressPercent">
              0%
            </span>

          </div>

          <div class="progress-bar">

            <div
              id="progressValue"
              class="progress-value"
            ></div>

          </div>

        </div>

      </section>


      <!-- =================================================
           LATEST RESULT
      ================================================== -->

      <section
        id="latestSection"
        class="card latest hidden"
      >

        <div class="latest-content">

          <div class="section-title">

            <h2>
              最新の研究結果
            </h2>

            <span>
              タップして詳細を表示
            </span>

          </div>


          <div class="result-head">

            <div>

              <h2
                id="latestTitle"
                class="result-title"
              ></h2>

              <div
                id="latestDate"
                class="result-date"
              ></div>

            </div>


            <div
              id="latestSymbol"
              class="symbol unknown"
            >
              ?
            </div>

          </div>


          <div
            id="latestSummary"
            class="result-summary"
          ></div>


          <div
            id="latestMeta"
            class="result-meta"
          ></div>


          <div class="actions">

            <button
              id="evaluateButton"
              class="primary"
            >
              この結果を評価
            </button>

            <button
              id="toggleDetailsButton"
              class="secondary"
            >
              詳細を表示
            </button>

          </div>


          <div
            id="details"
            class="details hidden"
          >

            <div class="detail-block">

              <h3>
                仮説
              </h3>

              <p id="detailHypothesis"></p>

            </div>


            <div class="detail-block">

              <h3>
                計算
              </h3>

              <p id="detailCalculation"></p>

            </div>


            <div class="detail-block">

              <h3>
                検証
              </h3>

              <p id="detailVerification"></p>

            </div>


            <div class="detail-block">

              <h3>
                次の行動
              </h3>

              <p id="detailNextAction"></p>

            </div>


            <div class="detail-block">

              <h3>
                研究ルート
              </h3>

              <p id="detailRoute"></p>

            </div>


            <div class="detail-block">

              <h3>
                評価理由
              </h3>

              <p id="detailReason"></p>

            </div>


            <div
              id="evaluationGrid"
              class="evaluation-grid"
            ></div>

          </div>

        </div>

      </section>

    </main>


    <!-- ===================================================
         RIGHT
    ==================================================== -->

    <aside class="card right-card">

      <div class="section-title">

        <h2>
          研究履歴
        </h2>

        <span id="historyCount">
          0件
        </span>

      </div>


      <div
        id="historyList"
        class="history-list"
      >

        <div class="history-empty">
          まだ研究結果がありません。
        </div>

      </div>


      <p class="small-note">
        最新100件を表示します。
        保存された研究結果はAI側からも参照できます。
      </p>

    </aside>

  </div>

</div>


<script>

/* ==========================================================
   SUPABASE CONFIG
========================================================== */

const SUPABASE_URL =
  "https://hiefdcodifkfhnqvruzn.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_HmcPY6BGvUQTPESGHVe7Hw_W4NlTPqj";


/* ==========================================================
   FUNCTION NAMES
========================================================== */

const RESEARCH_FUNCTION =
  "research";

const EVALUATE_FUNCTION =
  "evaluate";


/* ==========================================================
   PROJECT ID
========================================================== */

const DEFAULT_PROJECT_ID =
  "4253800d-a89e-45e2-a36a-cc52eb6c510b";


/* ==========================================================
   SUPABASE
========================================================== */

const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
  );


/* ==========================================================
   STATE
========================================================== */

let currentProjectId =
  localStorage.getItem(
    "research_project_id",
  );

if (!currentProjectId) {

  currentProjectId =
    DEFAULT_PROJECT_ID;

  localStorage.setItem(
    "research_project_id",
    currentProjectId,
  );
}


let latestResult = null;


/* ==========================================================
   DOM
========================================================== */

const questionInput =
  document.getElementById(
    "questionInput",
  );

const researchButton =
  document.getElementById(
    "researchButton",
  );

const clearButton =
  document.getElementById(
    "clearButton",
  );

const statusBox =
  document.getElementById(
    "statusBox",
  );

const connectionDot =
  document.getElementById(
    "connectionDot",
  );

const connectionText =
  document.getElementById(
    "connectionText",
  );

const progress =
  document.getElementById(
    "progress",
  );

const progressText =
  document.getElementById(
    "progressText",
  );

const progressPercent =
  document.getElementById(
    "progressPercent",
  );

const progressValue =
  document.getElementById(
    "progressValue",
  );

const latestSection =
  document.getElementById(
    "latestSection",
  );

const latestTitle =
  document.getElementById(
    "latestTitle",
  );

const latestDate =
  document.getElementById(
    "latestDate",
  );

const latestSymbol =
  document.getElementById(
    "latestSymbol",
  );

const latestSummary =
  document.getElementById(
    "latestSummary",
  );

const latestMeta =
  document.getElementById(
    "latestMeta",
  );

const evaluateButton =
  document.getElementById(
    "evaluateButton",
  );

const toggleDetailsButton =
  document.getElementById(
    "toggleDetailsButton",
  );

const details =
  document.getElementById(
    "details",
  );

const historyList =
  document.getElementById(
    "historyList",
  );

const historyCount =
  document.getElementById(
    "historyCount",
  );


/* ==========================================================
   CONNECTION CHECK
========================================================== */

async function checkConnection() {

  try {

    const {
      error,
    } =
      await supabase
        .from("research_results")
        .select(
          "id",
          {
            count: "exact",
            head: true,
          },
        )
        .eq(
          "project_id",
          currentProjectId,
        );


    if (error) {
      throw error;
    }


    connectionDot
      .classList
      .remove("error");

    connectionDot
      .classList
      .add("ok");

    connectionText.textContent =
      "Supabase 接続済み";


    return true;

  } catch (error) {

    console.error(
      "Supabase connection error:",
      error,
    );


    connectionDot
      .classList
      .remove("ok");

    connectionDot
      .classList
      .add("error");

    connectionText.textContent =
      "Supabase 接続エラー";


    return false;
  }
}


/* ==========================================================
   STATUS
========================================================== */

function showStatus(
  message,
  type = "",
) {

  statusBox.textContent =
    message;

  statusBox.className =
    "status-box show";

  if (type) {
    statusBox.classList.add(type);
  }
}


function hideStatus() {

  statusBox.className =
    "status-box";
}


/* ==========================================================
   PROGRESS
========================================================== */

function setProgress(
  percent,
  text,
) {

  progress.classList.remove(
    "hidden",
  );

  const safe =
    Math.max(
      0,
      Math.min(
        100,
        percent,
      ),
    );

  progressValue.style.width =
    `${safe}%`;

  progressPercent.textContent =
    `${Math.round(safe)}%`;

  progressText.textContent =
    text;
}


/* ==========================================================
   RESEARCH
========================================================== */

async function runResearch() {

  const message =
    questionInput.value.trim();


  if (!message) {

    showStatus(
      "研究したい数学的な問題を入力してください。",
      "error",
    );

    questionInput.focus();

    return;
  }


  researchButton.disabled =
    true;

  clearButton.disabled =
    true;

  evaluateButton.disabled =
    true;


  setProgress(
    5,
    "研究を準備しています...",
  );


  showStatus(
    "研究AIに接続しています...",
  );


  try {

    setProgress(
      15,
      "過去の研究履歴を確認しています...",
    );


    const response =
      await supabase.functions.invoke(
        RESEARCH_FUNCTION,
        {
          body: {
            message,

            project_id:
              currentProjectId,
          },
        },
      );


    if (response.error) {

      throw new Error(
        response.error.message ||
        "Edge Functionの呼び出しに失敗しました。",
      );
    }


    const data =
      response.data;


    if (!data) {

      throw new Error(
        "AIからデータが返ってきませんでした。",
      );
    }


    if (!data.ok) {

      throw new Error(
        data.error ||
        data.detail ||
        "研究AIでエラーが発生しました。",
      );
    }


    setProgress(
      70,
      "研究結果を受け取りました...",
    );


    /*
     * 3回ルート禁止に該当した場合
     */

    if (data.blocked) {

      setProgress(
        100,
        "既使用ルートを検出しました。",
      );


      showStatus(
        [
          "この研究ルートは3回以上使用されています。",
          "",
          data.answer || "",
          "",
          "別のアプローチを探します。",
        ].join("\n"),
        "success",
      );


      /*
       * ここではDBに新規結果を保存していないため、
       * 最新結果は更新しない。
       */

      await loadHistory();

      return;
    }


    /*
     * 正常な研究結果
     */

    if (!data.result_id) {

      console.warn(
        "result_id がありません。",
        data,
      );

    }


    latestResult = {

      id:
        data.result_id,

      title:
        data.research?.title ||
        "AI研究回答",

      description:
        data.research?.summary ||
        "",

      status:
        data.research?.status ||
        "maybe",

      hypothesis:
        data.research?.hypothesis ||
        "",

      calculation:
        data.research?.calculation ||
        "",

      verification:
        data.research?.verification ||
        "",

      next_action:
        data.research?.next_action ||
        "",

      evidence: {

        route:
          data.research?.route ||
          "",

        route_key:
          data.research?.route_key ||
          "",

        route_count:
          data.research?.route_count ||
          1,

        confidence:
          data.research?.confidence ||
          0,

      },

      created_at:
        new Date().toISOString(),

    };


    renderLatestResult(
      latestResult,
    );


    setProgress(
      85,
      "研究結果を保存しました。評価準備中...",
    );


    showStatus(
      "研究結果を保存しました。必要なら「この結果を評価」で○△×判定できます。",
      "success",
    );


    await loadHistory();


    setProgress(
      100,
      "研究完了",
    );


  } catch (error) {

    console.error(
      "Research error:",
      error,
    );


    showStatus(
      formatError(error),
      "error",
    );


    setProgress(
      100,
      "エラーで終了",
    );


  } finally {

    researchButton.disabled =
      false;

    clearButton.disabled =
      false;

    evaluateButton.disabled =
      !latestResult;

  }
}


/* ==========================================================
   EVALUATE
========================================================== */

async function evaluateLatest() {

  if (!latestResult?.id) {

    showStatus(
      "評価する研究結果がありません。",
      "error",
    );

    return;
  }


  evaluateButton.disabled =
    true;

  researchButton.disabled =
    true;


  setProgress(
    50,
    "研究結果を検証しています...",
  );


  showStatus(
    "評価AIが研究結果を確認しています...",
  );


  try {

    const response =
      await supabase.functions.invoke(
        EVALUATE_FUNCTION,
        {
          body: {

            project_id:
              currentProjectId,

            result_id:
              latestResult.id,

          },
        },
      );


    if (response.error) {

      throw new Error(
        response.error.message ||
        "評価Functionの呼び出しに失敗しました。",
      );
    }


    const data =
      response.data;


    if (!data) {

      throw new Error(
        "評価AIからデータが返ってきませんでした。",
      );
    }


    if (!data.ok) {

      throw new Error(
        data.error ||
        data.detail ||
        "評価AIでエラーが発生しました。",
      );
    }


    const evaluation =
      data.evaluation;


    /*
     * 最新結果に評価を追加
     */

    latestResult.evidence =
      latestResult.evidence ||
      {};

    latestResult.evidence.evaluation =
      evaluation;


    renderLatestResult(
      latestResult,
    );


    setProgress(
      100,
      "評価完了",
    );


    showStatus(
      `評価完了：${evaluation.overall_symbol || "△"}\n\n${evaluation.reason || ""}`,
      "success",
    );


    /*
     * 履歴も再取得
     */

    await loadHistory();


    /*
     * 詳細を自動表示
     */

    details.classList.remove(
      "hidden",
    );

    toggleDetailsButton.textContent =
      "詳細を閉じる";


  } catch (error) {

    console.error(
      "Evaluation error:",
      error,
    );


    showStatus(
      formatError(error),
      "error",
    );


    setProgress(
      100,
      "評価エラー",
    );


  } finally {

    evaluateButton.disabled =
      false;

    researchButton.disabled =
      false;

  }
}


/* ==========================================================
   LOAD HISTORY
========================================================== */

async function loadHistory() {

  try {

    const {
      data,
      error,
    } =
      await supabase
        .from("research_results")
        .select(`
          id,
          project_id,
          hypothesis_id,
          title,
          description,
          status,
          hypothesis,
          calculation,
          verification,
          next_action,
          evidence,
          created_at
        `)
        .eq(
          "project_id",
          currentProjectId,
        )
        .order(
          "created_at",
          {
            ascending: false,
          },
        )
        .limit(100);


    if (error) {
      throw error;
    }


    renderHistory(
      data || [],
    );


  } catch (error) {

    console.error(
      "History error:",
      error,
    );


    historyList.innerHTML = `
      <div class="history-empty">
        履歴を読み込めませんでした。
      </div>
    `;
  }
}


/* ==========================================================
   RENDER HISTORY
========================================================== */

function renderHistory(
  results,
) {

  historyCount.textContent =
    `${results.length}件`;


  if (!results.length) {

    historyList.innerHTML = `
      <div class="history-empty">
        まだ研究結果がありません。
      </div>
    `;

    return;
  }


  historyList.innerHTML =
    results
      .map(
        result =>
          createHistoryItem(
            result,
          ),
      )
      .join("");


  /*
   * 履歴クリック
   */

  historyList
    .querySelectorAll(
      "[data-result-id]",
    )
    .forEach(
      element => {

        element.addEventListener(
          "click",
          () => {

            const id =
              element.dataset.resultId;

            const result =
              results.find(
                item =>
                  item.id === id,
              );

            if (result) {

              latestResult =
                result;

              renderLatestResult(
                result,
              );

              window.scrollTo({
                top: 0,
                behavior: "smooth",
              });
            }

          },
        );
      },
    );
}


/* ==========================================================
   HISTORY ITEM
========================================================== */

function createHistoryItem(
  result,
) {

  const evaluation =
    result?.evidence?.evaluation;


  const status =
    evaluation?.overall ||
    result.status ||
    "maybe";


  const symbol =
    evaluation?.overall_symbol ||
    statusToSymbol(status);


  const title =
    escapeHtml(
      result.title ||
      "無題の研究",
    );


  const date =
    formatDate(
      result.created_at,
    );


  return `
    <div
      class="history-item"
      data-result-id="${escapeHtml(result.id)}"
    >

      <div class="history-main">

        <div
          class="history-symbol ${statusClass(status)}"
        >
          ${escapeHtml(symbol)}
        </div>

        <div style="min-width:0">

          <div class="history-title">
            ${title}
          </div>

          <div class="history-date">
            ${date}
          </div>

        </div>

      </div>

    </div>
  `;
}


/* ==========================================================
   RENDER LATEST
========================================================== */

function renderLatestResult(
  result,
) {

  latestSection.classList.remove(
    "hidden",
  );


  latestTitle.textContent =
    result.title ||
    "AI研究回答";


  latestDate.textContent =
    formatDate(
      result.created_at,
    );


  const evaluation =
    result?.evidence?.evaluation;


  const status =
    evaluation?.overall ||
    result.status ||
    "maybe";


  const symbol =
    evaluation?.overall_symbol ||
    statusToSymbol(status);


  latestSymbol.textContent =
    symbol;


  latestSymbol.className =
    `symbol ${statusClass(status)}`;


  latestSummary.textContent =
    result.description ||
    result.evidence?.summary ||
    "研究結果が保存されています。";


  latestMeta.innerHTML = "";


  addTag(
    latestMeta,
    `状態: ${statusLabel(status)}`,
  );


  if (
    result?.evidence?.route
  ) {

    addTag(
      latestMeta,
      `ルート: ${result.evidence.route}`,
    );

  }


  if (
    result?.evidence?.route_count
  ) {

    addTag(
      latestMeta,
      `使用回数: ${result.evidence.route_count}`,
    );

  }


  if (
    typeof result?.evidence?.confidence ===
    "number"
  ) {

    addTag(
      latestMeta,
      `信頼度: ${Math.round(
        result.evidence.confidence * 100,
      )}%`,
    );

  }


  /*
   * 詳細
   */

  document.getElementById(
    "detailHypothesis",
  ).textContent =
    result.hypothesis ||
    "記録なし";


  document.getElementById(
    "detailCalculation",
  ).textContent =
    result.calculation ||
    "記録なし";


  document.getElementById(
    "detailVerification",
  ).textContent =
    result.verification ||
    "記録なし";


  document.getElementById(
    "detailNextAction",
  ).textContent =
    result.next_action ||
    "記録なし";


  document.getElementById(
    "detailRoute",
  ).textContent =
    result?.evidence?.route ||
    "記録なし";


  document.getElementById(
    "detailReason",
  ).textContent =
    evaluation?.reason ||
    "まだ評価されていません。";


  renderEvaluationGrid(
    evaluation,
  );


  evaluateButton.disabled =
    !result.id;

}


/* ==========================================================
   EVALUATION GRID
========================================================== */

function renderEvaluationGrid(
  evaluation,
) {

  const grid =
    document.getElementById(
      "evaluationGrid",
    );


  if (!evaluation) {

    grid.innerHTML = `
      <div class="evaluation-item">
        <div class="label">
          評価
        </div>
        <div class="value">
          未評価
        </div>
      </div>
    `;

    return;
  }


  const items = [

    [
      "総合",
      evaluation.overall_symbol ||
      "△",
    ],

    [
      "仮説",
      evaluation.hypothesis_symbol ||
      "△",
    ],

    [
      "計算",
      evaluation.calculation_symbol ||
      "△",
    ],

    [
      "検証",
      evaluation.verification_symbol ||
      "△",
    ],

    [
      "論理",
      evaluation.logic_symbol ||
      "△",
    ],

  ];


  grid.innerHTML =
    items
      .map(
        ([label, value]) => `
          <div class="evaluation-item">

            <div class="label">
              ${escapeHtml(label)}
            </div>

            <div class="value">
              ${escapeHtml(value)}
            </div>

          </div>
        `,
      )
      .join("");
}


/* ==========================================================
   TAG
========================================================== */

function addTag(
  container,
  text,
) {

  const element =
    document.createElement(
      "span",
    );

  element.className =
    "tag";

  element.textContent =
    text;

  container.appendChild(
    element,
  );
}


/* ==========================================================
   DETAILS
========================================================== */

toggleDetailsButton.addEventListener(
  "click",
  () => {

    const hidden =
      details.classList.contains(
        "hidden",
      );


    details.classList.toggle(
      "hidden",
    );


    toggleDetailsButton.textContent =
      hidden
        ? "詳細を閉じる"
        : "詳細を表示";

  },
);


/* ==========================================================
   BUTTONS
========================================================== */

researchButton.addEventListener(
  "click",
  runResearch,
);


evaluateButton.addEventListener(
  "click",
  evaluateLatest,
);


clearButton.addEventListener(
  "click",
  () => {

    questionInput.value =
      "";

    hideStatus();

    progress.classList.add(
      "hidden",
    );

  },
);


/* ==========================================================
   ENTER KEY
========================================================== */

questionInput.addEventListener(
  "keydown",
  event => {

    /*
     * Mac / iPadの
     * Command + Enter
     */

    if (
      (event.metaKey ||
        event.ctrlKey) &&
      event.key === "Enter"
    ) {

      event.preventDefault();

      runResearch();
    }

  },
);


/* ==========================================================
   HELPERS
========================================================== */

function statusToSymbol(
  status,
) {

  if (status === "good") {
    return "○";
  }

  if (status === "bad") {
    return "×";
  }

  return "△";
}


function statusClass(
  status,
) {

  if (status === "good") {
    return "good";
  }

  if (status === "bad") {
    return "bad";
  }

  if (status === "maybe") {
    return "maybe";
  }

  return "unknown";
}


function statusLabel(
  status,
) {

  if (status === "good") {
    return "良";
  }

  if (status === "bad") {
    return "不成立・問題あり";
  }

  return "要検証";
}


function formatDate(
  date,
) {

  if (!date) {
    return "";
  }


  const value =
    new Date(date);


  if (
    Number.isNaN(
      value.getTime(),
    )
  ) {
    return "";
  }


  return value.toLocaleString(
    "ja-JP",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
    },
  );
}


function escapeHtml(
  value,
) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;",
    )
    .replace(
      /</g,
      "&lt;",
    )
    .replace(
      />/g,
      "&gt;",
    )
    .replace(
      /"/g,
      "&quot;",
    )
    .replace(
      /'/g,
      "&#039;",
    );
}


function formatError(
  error,
) {

  if (!error) {
    return "不明なエラーです。";
  }


  let message =
    error.message ||
    String(error);


  /*
   * よくあるSupabaseエラーを
   * 少し分かりやすくする。
   */

  if (
    message.includes(
      "Failed to send a request to the Edge Function",
    )
  ) {

    return [
      "Edge Functionへの接続に失敗しました。",
      "",
      "SupabaseのEdge Functionsで",
      "research / evaluate がDeploy済みか確認してください。",
    ].join("\n");
  }


  return message;
}


/* ==========================================================
   INITIALIZE
========================================================== */

async function initialize() {

  await checkConnection();

  await loadHistory();

}


/* ==========================================================
   START
========================================================== */

initialize();

</script>
