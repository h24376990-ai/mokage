<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Research AI Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #202124;
      --sub: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --good: #16a34a;
      --maybe: #d97706;
      --bad: #dc2626;
      --shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: white;
      font-weight: 700;
    }

    .brand h1 {
      font-size: 20px;
      margin: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--sub);
      font-size: 12px;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
    }

    .connection-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9ca3af;
    }

    .connection-dot.ok {
      background: var(--good);
    }

    .connection-dot.error {
      background: var(--bad);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: 1fr;
      }

      header {
        align-items: flex-start;
      }

      .connection {
        font-size: 11px;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .research-card {
      padding: 20px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .section-title span {
      color: var(--sub);
      font-size: 12px;
    }

    textarea {
      width: 100%;
      min-height: 170px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 15px;
      outline: none;
      background: #fafafa;
    }

    textarea:focus {
      border-color: var(--accent);
      background: white;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .primary,
    .secondary {
      border: none;
      border-radius: 11px;
      padding: 11px 16px;
      font-weight: 600;
    }

    .primary {
      background: var(--accent);
      color: white;
    }

    .primary:hover {
      background: var(--accent-hover);
    }

    .secondary {
      background: #eef0f3;
      color: #374151;
    }

    .primary:disabled,
    .secondary:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--line);
      font-size: 13px;
      white-space: pre-wrap;
      display: none;
      line-height: 1.65;
    }

    .status-box.show {
      display: block;
    }

    .status-box.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .status-box.success {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #166534;
    }

    .latest {
      margin-top: 20px;
    }

    .latest-content {
      padding: 18px;
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .result-title {
      margin: 0;
      font-size: 18px;
    }

    .result-date {
      color: var(--sub);
      font-size: 11px;
      margin-top: 5px;
    }

    .symbol {
      min-width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      border: 1px solid var(--line);
    }

    .symbol.good {
      color: var(--good);
      background: #f0fdf4;
    }

    .symbol.maybe {
      color: var(--maybe);
      background: #fffbeb;
    }

    .symbol.bad {
      color: var(--bad);
      background: #fef2f2;
    }

    .symbol.unknown {
      color: #6b7280;
      background: #f3f4f6;
    }

    .result-summary {
      margin-top: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .result-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .tag {
      background: #f3f4f6;
      border-radius: 999px;
      padding: 5px 9px;
      color: #4b5563;
      font-size: 11px;
    }

    .details {
      margin-top: 15px;
      border-top: 1px solid var(--line);
      padding-top: 15px;
    }

    .detail-block {
      margin-bottom: 18px;
    }

    .detail-block h3 {
      margin: 0 0 7px;
      font-size: 13px;
    }

    .detail-block p {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 13px;
      color: #374151;
    }

    .right-card {
      padding: 18px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      max-height: 650px;
      overflow-y: auto;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px;
      background: white;
      transition: .15s;
    }

    .history-item:hover {
      border-color: #cbd5e1;
      background: #fafafa;
    }

    .history-main {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .history-symbol {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
    }

    .history-symbol.good {
      color: var(--good);
      background: #f0fdf4;
    }

    .history-symbol.maybe {
      color: var(--maybe);
      background: #fffbeb;
    }

    .history-symbol.bad {
      color: var(--bad);
      background: #fef2f2;
    }

    .history-symbol.unknown {
      color: #6b7280;
      background: #f3f4f6;
    }

    .history-title {
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-date {
      color: var(--sub);
      font-size: 10px;
      margin-top: 3px;
    }

    .history-empty {
      text-align: center;
      color: var(--sub);
      padding: 30px 10px;
      font-size: 13px;
    }

    .small-note {
      color: var(--sub);
      font-size: 11px;
      line-height: 1.6;
      margin-top: 10px;
    }

    .progress {
      margin-top: 14px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--sub);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #e5e7eb;
      overflow: hidden;
    }

    .progress-value {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width .25s;
    }

    .evaluation-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .evaluation-item {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fafafa;
    }

    .evaluation-item .label {
      font-size: 10px;
      color: var(--sub);
    }

    .evaluation-item .value {
      margin-top: 3px;
      font-weight: 700;
      font-size: 17px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<script>

/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL =
  "https://hiefdcodifkfhnqvruzn.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_HmcPY6BGvUQTPESGHVe7Hw_W4NlTPqj";


/*
 * 重要：
 *
 * Supabaseに存在するFunctionは
 *
 * research-ai
 * smart-handler
 *
 * であり、
 *
 * "research"
 *
 * ではない。
 *
 * 今回はsmart-handlerを使用する。
 */

const RESEARCH_FUNCTION =
  "smart-handler";


const EVALUATE_FUNCTION =
  "evaluate";


const DEFAULT_PROJECT_ID =
  "4253800d-a89e-45e2-a36a-cc52eb6c510b";


/* =========================================================
   STATE
========================================================= */

let projectId =
  localStorage.getItem(
    "research_project_id"
  );


if (!projectId) {

  projectId =
    DEFAULT_PROJECT_ID;

  localStorage.setItem(
    "research_project_id",
    projectId
  );
}


let latestResult = null;


/* =========================================================
   DOM
========================================================= */

const questionInput =
  document.getElementById(
    "questionInput"
  );


const researchButton =
  document.getElementById(
    "researchButton"
  );


const clearButton =
  document.getElementById(
    "clearButton"
  );


const evaluateButton =
  document.getElementById(
    "evaluateButton"
  );


const toggleDetailsButton =
  document.getElementById(
    "toggleDetailsButton"
  );


const statusBox =
  document.getElementById(
    "statusBox"
  );


const connectionDot =
  document.getElementById(
    "connectionDot"
  );


const connectionText =
  document.getElementById(
    "connectionText"
  );


const progress =
  document.getElementById(
    "progress"
  );


const progressText =
  document.getElementById(
    "progressText"
  );


const progressPercent =
  document.getElementById(
    "progressPercent"
  );


const progressValue =
  document.getElementById(
    "progressValue"
  );


const latestSection =
  document.getElementById(
    "latestSection"
  );


const latestTitle =
  document.getElementById(
    "latestTitle"
  );


const latestDate =
  document.getElementById(
    "latestDate"
  );


const latestSymbol =
  document.getElementById(
    "latestSymbol"
  );


const latestSummary =
  document.getElementById(
    "latestSummary"
  );


const latestMeta =
  document.getElementById(
    "latestMeta"
  );


const details =
  document.getElementById(
    "details"
  );


const historyList =
  document.getElementById(
    "historyList"
  );


const historyCount =
  document.getElementById(
    "historyCount"
  );


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  message,
  type = ""
) {

  statusBox.textContent =
    String(message || "");

  statusBox.className =
    "status-box show";

  if (type) {

    statusBox.classList.add(
      type
    );
  }
}


function hideStatus() {

  statusBox.className =
    "status-box";
}


/* =========================================================
   PROGRESS
========================================================= */

function setProgress(
  percent,
  text
) {

  progress.classList.remove(
    "hidden"
  );

  const safe =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );

  progressValue.style.width =
    `${safe}%`;

  progressPercent.textContent =
    `${Math.round(safe)}%`;

  progressText.textContent =
    text || "";
}


/* =========================================================
   FETCH JSON
========================================================= */

async function fetchJson(
  url,
  options = {}
) {

  let response;

  try {

    response =
      await fetch(
        url,
        {
          ...options,

          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`,

            "Content-Type":
              "application/json",

            ...(options.headers || {})
          }
        }
      );

  } catch (error) {

    /*
     * Safariで最も重要な部分。
     *
     * Consoleを開かなくても
     * Load failedの正体を画面に出す。
     */

    throw new Error(
      [
        "Supabaseへの通信に失敗しました。",
        "",
        "Function:",
        url,
        "",
        "Safariが通信そのものを完了できませんでした。",
        "",
        "考えられる原因：",
        "・Edge FunctionのDeploy状態",
        "・Edge FunctionのCORS設定",
        "・Function名の間違い",
        "・Supabase側の一時的な通信エラー",
        "",
        `元のエラー: ${error?.message || error}`
      ].join("\n")
    );
  }


  const text =
    await response.text();


  let data = null;


  if (text) {

    try {

      data =
        JSON.parse(text);

    } catch {

      data =
        text;
    }
  }


  if (!response.ok) {

    let message =
      `Supabase HTTP ${response.status}`;


    if (
      data &&
      typeof data === "object"
    ) {

      if (data.error) {

        message +=
          `\n${data.error}`;
      }

      if (data.message) {

        message +=
          `\n${data.message}`;
      }

      if (data.detail) {

        message +=
          `\n${data.detail}`;
      }

    } else if (
      typeof data === "string" &&
      data
    ) {

      message +=
        `\n${data}`;
    }


    throw new Error(
      message
    );
  }


  return data;
}


/* =========================================================
   EDGE FUNCTION
========================================================= */

async function callFunction(
  functionName,
  body
) {

  const url =
    `${SUPABASE_URL}/functions/v1/${functionName}`;


  return await fetchJson(
    url,
    {
      method: "POST",

      body:
        JSON.stringify(body)
    }
  );
}


/* =========================================================
   CONNECTION
========================================================= */

async function checkConnection() {

  connectionText.textContent =
    "Supabase 接続確認中...";


  connectionDot.classList.remove(
    "ok",
    "error"
  );


  try {

    await fetchJson(
      `${SUPABASE_URL}/rest/v1/research_results?select=id&project_id=eq.${encodeURIComponent(projectId)}&limit=1`
    );


    connectionDot.classList.add(
      "ok"
    );


    connectionText.textContent =
      "Supabase 接続済み";


    return true;

  } catch (error) {

    connectionDot.classList.add(
      "error"
    );


    connectionText.textContent =
      "Supabase 接続エラー";


    return false;
  }
}


/* =========================================================
   RESEARCH
========================================================= */

async function runResearch() {

  const message =
    questionInput.value.trim();


  if (!message) {

    showStatus(
      "研究したい数学的な問題を入力してください。",
      "error"
    );


    questionInput.focus();

    return;
  }


  researchButton.disabled =
    true;


  clearButton.disabled =
    true;


  evaluateButton.disabled =
    true;


  setProgress(
    5,
    "研究を準備しています..."
  );


  showStatus(
    "研究AIに接続しています..."
  );


  try {

    setProgress(
      15,
      "smart-handlerに接続しています..."
    );


    /*
     * ここが最重要。
     *
     * 以前：
     * research
     *
     * 現在：
     * smart-handler
     */

    const data =
      await callFunction(
        RESEARCH_FUNCTION,
        {
          message:
            message,

          project_id:
            projectId
        }
      );


    if (!data) {

      throw new Error(
        "研究AIからデータが返ってきませんでした。"
      );
    }


    /*
     * smart-handlerの
     * 正常レスポンス
     */

    if (
      data.ok === false
    ) {

      throw new Error(
        data.error ||
        data.detail ||
        "smart-handlerでエラーが発生しました。"
      );
    }


    setProgress(
      65,
      "研究結果を解析しています..."
    );


    /*
     * 既使用ルート
     */

    if (
      data.blocked
    ) {

      setProgress(
        100,
        "既使用ルートを検出しました。"
      );


      showStatus(
        [
          "この研究ルートは3回以上使用されています。",
          "",
          data.answer || "",
          "",
          "別のアプローチを探します。"
        ].join("\n"),
        "success"
      );


      await loadHistory();


      return;
    }


    /*
     * researchオブジェクトを取得
     */

    let research =
      data.research ||
      data.result ||
      null;


    /*
     * もしresearchが文字列JSONなら
     * JSONとして解析する。
     */

    if (
      typeof research === "string"
    ) {

      try {

        research =
          JSON.parse(
            research
          );

      } catch {

        /*
         * JSONではない場合は
         * descriptionとして扱う。
         */

        research = {

          title:
            data.title ||
            "AI研究回答",

          description:
            research,

          status:
            data.status ||
            "maybe"
        };
      }
    }


    research =
      research || {};


    /*
     * result_idは
     * Edge Functionから返されたものを優先。
     */

    const resultId =
      data.result_id ||
      data.id ||
      research.id ||
      null;


    const evidence =
      research.evidence &&
      typeof research.evidence === "object"
        ? research.evidence
        : {};


    latestResult = {

      id:
        resultId,


      title:
        research.title ||
        data.title ||
        "AI研究回答",


      description:
        research.description ||
        research.summary ||
        data.description ||
        data.answer ||
        "",


      status:
        research.status ||
        data.status ||
        "maybe",


      confidence:
        Number(
          research.confidence ??
          data.confidence ??
          0
        ),


      confidence_basis:
        research.confidence_basis ||
        data.confidence_basis ||
        "",


      hypothesis:
        research.hypothesis ||
        "",


      calculation:
        research.calculation ||
        "",


      verification:
        research.verification ||
        "",


      next_action:
        research.next_action ||
        "",


      evidence: {

        ...evidence,

        route:
          evidence.route ||
          research.route ||
          data.route ||
          "",


        route_key:
          evidence.route_key ||
          research.route_key ||
          data.route_key ||
          "",


        route_count:
          Number(
            evidence.route_count ??
            research.route_count ??
            data.route_count ??
            1
          ),


        confidence:
          Number(
            evidence.confidence ??
            research.confidence ??
            data.confidence ??
            0
          ),


        confidence_basis:
          evidence.confidence_basis ||
          research.confidence_basis ||
          data.confidence_basis ||
          "",


        items:
          Array.isArray(
            evidence.items
          )
            ? evidence.items
            : [],

      },


      created_at:
        research.created_at ||
        data.created_at ||
        new Date().toISOString()
    };


    /*
     * 評価情報が
     * Functionから返ってきた場合も保持。
     */

    if (
      data.evaluation
    ) {

      latestResult.evidence.evaluation =
        data.evaluation;
    }


    setProgress(
      80,
      "研究結果を表示しています..."
    );


    renderLatestResult(
      latestResult
    );


    /*
     * result_idがある場合
     */

    if (
      latestResult.id
    ) {

      showStatus(
        "研究結果を受け取りました。保存された研究結果を表示しています。",
        "success"
      );

    } else {

      showStatus(
        [
          "研究AIから回答は返ってきました。",
          "",
          "ただしresult_idが返っていません。",
          "そのため、この結果について「評価」を実行できません。"
        ].join("\n"),
        "success"
      );
    }


    setProgress(
      90,
      "研究履歴を更新しています..."
    );


    await loadHistory();


    setProgress(
      100,
      "研究完了"
    );


  } catch (error) {

    showStatus(
      formatError(error),
      "error"
    );


    setProgress(
      100,
      "エラーで終了"
    );

  } finally {

    researchButton.disabled =
      false;


    clearButton.disabled =
      false;


    evaluateButton.disabled =
      !latestResult?.id;
  }
}


/* =========================================================
   EVALUATE
========================================================= */

async function evaluateLatest() {

  if (
    !latestResult?.id
  ) {

    showStatus(
      "評価する研究結果がありません。",
      "error"
    );

    return;
  }


  evaluateButton.disabled =
    true;


  researchButton.disabled =
    true;


  setProgress(
    40,
    "評価AIに接続しています..."
  );


  showStatus(
    "評価AIが研究結果を確認しています..."
  );


  try {

    const data =
      await callFunction(
        EVALUATE_FUNCTION,
        {
          project_id:
            projectId,

          result_id:
            latestResult.id
        }
      );


    if (!data) {

      throw new Error(
        "評価AIからデータが返ってきませんでした。"
      );
    }


    if (
      data.ok === false
    ) {

      throw new Error(
        data.error ||
        data.detail ||
        "evaluateでエラーが発生しました。"
      );
    }


    const evaluation =
      data.evaluation ||
      data.result ||
      data;


    latestResult.evidence =
      latestResult.evidence ||
      {};


    latestResult.evidence.evaluation =
      evaluation;


    renderLatestResult(
      latestResult
    );


    details.classList.remove(
      "hidden"
    );


    toggleDetailsButton.textContent =
      "詳細を閉じる";


    setProgress(
      100,
      "評価完了"
    );


    showStatus(
      [
        `評価完了：${
          evaluation?.overall_symbol ||
          "△"
        }`,
        "",
        evaluation?.reason ||
        ""
      ].join("\n"),
      "success"
    );


    await loadHistory();


  } catch (error) {

    showStatus(
      formatError(error),
      "error"
    );


    setProgress(
      100,
      "評価エラー"
    );


  } finally {

    evaluateButton.disabled =
      false;


    researchButton.disabled =
      false;
  }
}


/* =========================================================
   HISTORY
========================================================= */

async function loadHistory() {

  try {

    const data =
      await fetchJson(
        `${SUPABASE_URL}/rest/v1/research_results?select=id,project_id,hypothesis_id,title,description,status,hypothesis,calculation,verification,next_action,evidence,created_at&project_id=eq.${encodeURIComponent(projectId)}&order=created_at.desc&limit=100`
      );


    renderHistory(
      Array.isArray(data)
        ? data
        : []
    );


  } catch (error) {

    historyList.innerHTML = `
      <div class="history-empty">
        履歴を読み込めませんでした。
      </div>
    `;
  }
}


/* =========================================================
   HISTORY RENDER
========================================================= */

function renderHistory(
  results
) {

  historyCount.textContent =
    `${results.length}件`;


  if (
    !results.length
  ) {

    historyList.innerHTML = `
      <div class="history-empty">
        まだ研究結果がありません。
      </div>
    `;

    return;
  }


  historyList.innerHTML =
    results
      .map(
        result =>
          createHistoryItem(
            result
          )
      )
      .join("");


  historyList
    .querySelectorAll(
      "[data-result-id]"
    )
    .forEach(
      element => {

        element.addEventListener(
          "click",
          () => {

            const id =
              element.dataset.resultId;


            const result =
              results.find(
                item =>
                  String(item.id) ===
                  String(id)
              );


            if (!result) {
              return;
            }


            latestResult =
              normalizeHistoryResult(
                result
              );


            renderLatestResult(
              latestResult
            );


            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });
          }
        );
      }
    );
}


/* =========================================================
   NORMALIZE HISTORY
========================================================= */

function normalizeHistoryResult(
  result
) {

  const evidence =
    result?.evidence &&
    typeof result.evidence === "object"
      ? result.evidence
      : {};


  return {

    ...result,

    evidence: {

      ...evidence,

      route:
        evidence.route ||
        "",


      route_key:
        evidence.route_key ||
        "",


      route_count:
        Number(
          evidence.route_count ??
          1
        ),


      confidence:
        Number(
          evidence.confidence ??
          0
        ),


      confidence_basis:
        evidence.confidence_basis ||
        "",


      items:
        Array.isArray(
          evidence.items
        )
          ? evidence.items
          : []
    }
  };
}


/* =========================================================
   HISTORY ITEM
========================================================= */

function createHistoryItem(
  result
) {

  const evaluation =
    result?.evidence?.evaluation;


  const status =
    evaluation?.overall ||
    result.status ||
    "maybe";


  const symbol =
    evaluation?.overall_symbol ||
    statusToSymbol(
      status
    );


  return `
    <div
      class="history-item"
      data-result-id="${escapeHtml(result.id)}"
    >

      <div class="history-main">

        <div
          class="history-symbol ${statusClass(status)}"
        >
          ${escapeHtml(symbol)}
        </div>

        <div style="min-width:0">

          <div class="history-title">
            ${escapeHtml(
              result.title ||
              "無題の研究"
            )}
          </div>

          <div class="history-date">
            ${formatDate(
              result.created_at
            )}
          </div>

        </div>

      </div>

    </div>
  `;
}


/* =========================================================
   RESULT RENDER
========================================================= */

function renderLatestResult(
  result
) {

  latestSection.classList.remove(
    "hidden"
  );


  latestTitle.textContent =
    result.title ||
    "AI研究回答";


  latestDate.textContent =
    formatDate(
      result.created_at
    );


  const evaluation =
    result?.evidence?.evaluation;


  const status =
    evaluation?.overall ||
    result.status ||
    "maybe";


  const symbol =
    evaluation?.overall_symbol ||
    statusToSymbol(
      status
    );


  latestSymbol.textContent =
    symbol;


  latestSymbol.className =
    `symbol ${statusClass(status)}`;


  latestSummary.textContent =
    result.description ||
    "研究結果が保存されています。";


  latestMeta.innerHTML =
    "";


  addTag(
    latestMeta,
    `状態: ${statusLabel(status)}`
  );


  const route =
    result?.evidence?.route;


  if (route) {

    addTag(
      latestMeta,
      `ルート: ${route}`
    );
  }


  const routeCount =
    result?.evidence?.route_count;


  if (
    routeCount
  ) {

    addTag(
      latestMeta,
      `使用回数: ${routeCount}`
    );
  }


  const confidence =
    Number(
      result?.evidence?.confidence ??
      result?.confidence ??
      0
    );


  if (
    Number.isFinite(confidence)
  ) {

    addTag(
      latestMeta,
      `信頼度: ${Math.round(
        confidence * 100
      )}%`
    );
  }


  const hypothesis =
    document.getElementById(
      "detailHypothesis"
    );


  const calculation =
    document.getElementById(
      "detailCalculation"
    );


  const verification =
    document.getElementById(
      "detailVerification"
    );


  const nextAction =
    document.getElementById(
      "detailNextAction"
    );


  const routeElement =
    document.getElementById(
      "detailRoute"
    );


  const reason =
    document.getElementById(
      "detailReason"
    );


  if (hypothesis) {

    hypothesis.textContent =
      result.hypothesis ||
      "記録なし";
  }


  if (calculation) {

    calculation.textContent =
      result.calculation ||
      "記録なし";
  }


  if (verification) {

    verification.textContent =
      result.verification ||
      "記録なし";
  }


  if (nextAction) {

    nextAction.textContent =
      result.next_action ||
      "記録なし";
  }


  if (routeElement) {

    routeElement.textContent =
      route ||
      "記録なし";
  }


  if (reason) {

    reason.textContent =
      evaluation?.reason ||
      "まだ評価されていません。";
  }


  renderEvaluationGrid(
    evaluation
  );


  evaluateButton.disabled =
    !result.id;
}


/* =========================================================
   EVALUATION GRID
========================================================= */

function renderEvaluationGrid(
  evaluation
) {

  const grid =
    document.getElementById(
      "evaluationGrid"
    );


  if (!grid) {
    return;
  }


  if (!evaluation) {

    grid.innerHTML = `
      <div class="evaluation-item">

        <div class="label">
          評価
        </div>

        <div class="value">
          未評価
        </div>

      </div>
    `;

    return;
  }


  const items = [

    [
      "総合",
      evaluation.overall_symbol ||
      "△"
    ],

    [
      "仮説",
      evaluation.hypothesis_symbol ||
      "△"
    ],

    [
      "計算",
      evaluation.calculation_symbol ||
      "△"
    ],

    [
      "検証",
      evaluation.verification_symbol ||
      "△"
    ],

    [
      "論理",
      evaluation.logic_symbol ||
      "△"
    ]

  ];


  grid.innerHTML =
    items
      .map(
        ([label, value]) => `
          <div class="evaluation-item">

            <div class="label">
              ${escapeHtml(label)}
            </div>

            <div class="value">
              ${escapeHtml(value)}
            </div>

          </div>
        `
      )
      .join("");
}


/* =========================================================
   DETAILS
========================================================= */

toggleDetailsButton.addEventListener(
  "click",
  () => {

    const hidden =
      details.classList.contains(
        "hidden"
      );


    details.classList.toggle(
      "hidden"
    );


    toggleDetailsButton.textContent =
      hidden
        ? "詳細を閉じる"
        : "詳細を表示";
  }
);


/* =========================================================
   BUTTONS
========================================================= */

researchButton.addEventListener(
  "click",
  runResearch
);


evaluateButton.addEventListener(
  "click",
  evaluateLatest
);


clearButton.addEventListener(
  "click",
  () => {

    questionInput.value =
      "";

    hideStatus();

    progress.classList.add(
      "hidden"
    );
  }
);


/* =========================================================
   KEYBOARD
========================================================= */

questionInput.addEventListener(
  "keydown",
  event => {

    if (
      (event.metaKey ||
       event.ctrlKey) &&
      event.key === "Enter"
    ) {

      event.preventDefault();

      runResearch();
    }
  }
);


/* =========================================================
   HELPERS
========================================================= */

function statusToSymbol(
  status
) {

  if (
    status === "good"
  ) {

    return "○";
  }


  if (
    status === "bad"
  ) {

    return "×";
  }


  return "△";
}


function statusClass(
  status
) {

  if (
    status === "good"
  ) {

    return "good";
  }


  if (
    status === "bad"
  ) {

    return "bad";
  }


  if (
    status === "maybe"
  ) {

    return "maybe";
  }


  return "unknown";
}


function statusLabel(
  status
) {

  if (
    status === "good"
  ) {

    return "良";
  }


  if (
    status === "bad"
  ) {

    return "不成立・問題あり";
  }


  return "要検証";
}


function addTag(
  container,
  text
) {

  if (!container) {
    return;
  }


  const element =
    document.createElement(
      "span"
    );


  element.className =
    "tag";


  element.textContent =
    text;


  container.appendChild(
    element
  );
}


function formatDate(
  date
) {

  if (!date) {
    return "";
  }


  const value =
    new Date(date);


  if (
    Number.isNaN(
      value.getTime()
    )
  ) {

    return "";
  }


  return value.toLocaleString(
    "ja-JP",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================================================
   ERROR
========================================================= */

function formatError(
  error
) {

  if (!error) {

    return [
      "不明なエラーが発生しました。"
    ].join("\n");
  }


  const message =
    error.message ||
    String(error);


  /*
   * SafariのLoad failed
   */

  if (
    message
      .toLowerCase()
      .includes(
        "load failed"
      )
  ) {

    return [
      "研究AIへの通信に失敗しました。",
      "",
      "接続先:",
      `${SUPABASE_URL}/functions/v1/${RESEARCH_FUNCTION}`,
      "",
      "使用Function:",
      RESEARCH_FUNCTION,
      "",
      "Supabase側のFunctionに接続できていません。",
      "",
      "このページ側ではこれ以上の設定変更は必要ありません。",
      "次に確認するのはSupabase側のsmart-handlerです。"
    ].join("\n");
  }


  /*
   * Failed to fetch
   */

  if (
    message
      .toLowerCase()
      .includes(
        "failed to fetch"
      )
  ) {

    return [
      "Supabaseへの通信に失敗しました。",
      "",
      "使用Function:",
      RESEARCH_FUNCTION,
      "",
      "Function名は smart-handler に設定されています。",
      "",
      "Supabase側のFunctionまたはCORS設定を確認する必要があります。"
    ].join("\n");
  }


  return message;
}


/* =========================================================
   INITIALIZE
========================================================= */

async function initialize() {

  /*
   * 接続チェックで失敗しても
   * ページ全体を止めない。
   */

  await checkConnection();


  /*
   * 履歴読み込みも独立。
   */

  await loadHistory();
}


/* =========================================================
   START
========================================================= */

initialize();

</script>
